{% extends "base.html" %}

{% block title %}
{{ media["title"] }}
{% endblock %}

{% block content %}

<h1>{{ media["title"] }}</h1>

<p>
    <strong>Type:</strong>
    {{ media["type"] }}
</p>

<p>
    <strong>Rating:</strong>
    {{ media["rating"] }}/10
</p>

<p>
    <strong>Genres:</strong>
    {{ media["genres"] or "No genres" }}
</p>

<br>

<a href="{{ url_for('edit_media', media_id=media['id']) }}">
    <button type="button">Edit</button>
</a>

<form
    action="{{ url_for('delete_media', media_id=media['id']) }}"
    method="POST"
    style="display: inline;"
>
    <button type="submit">Delete</button>
</form>

<br><br>

<a href="{{ url_for('media_list') }}">Back to My Media</a>

{% endblock %}
